name: Publish the app

# The phone app has to be served over HTTPS before Android will install it, so
# every push rebuilds it and puts it on GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/core/**'
      - 'src/ui/**'
      - package.json
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push is the one that matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build:app
      - uses: actions/configure-pages@v5
        # Turn Pages on and point it at this workflow, rather than depending on
        # the repository setting being right. Without this the step fails with a
        # bare "Not Found" when Pages is off, or still set to deploy a branch.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
