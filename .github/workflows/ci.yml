name: Checks

# Everything that must hold before a change is merged. The Pages workflow
# deploys the phone app; this one guards the extension as well.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:app

      # The packaged extensions, so a release can be assembled from a green run.
      - run: npm run zip && npm run zip:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: .output/*.zip
          if-no-files-found: error
