name: Checks

# Everything that must hold before a change is merged. The Pages workflow
# deploys the phone app; this one guards the extension as well.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      # The Safari build is the extension half of the Apple version; the Xcode
      # wrap around it needs a Mac, so this is as far as CI can take it.
      - run: npm run build:safari
      - run: npm run build:site
      - run: npm run build:app
      - run: npm run build:team

      # The packaged extensions, so a release can be assembled from a green run.
      - run: npm run zip && npm run zip:firefox && npm run zip:safari

      # Out of .output and into a plain directory first. Globs do not reliably
      # look inside a dot-directory, and an upload that matches nothing fails
      # with everything before it green, which reads as a broken build.
      - name: Collect the packages
        run: |
          mkdir -p packages
          cp .output/*.zip packages/
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: packages/*.zip
          if-no-files-found: error
