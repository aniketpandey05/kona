<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No remote anything, ever, enforced rather than promised: this app makes no
      network request, and a policy that says so is how a reader checks it
      without reading all of the JavaScript.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'"
    />
    <title>Kona</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/renderer.tsx"></script>
  </body>
</html>
